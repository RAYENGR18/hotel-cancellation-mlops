[tool.poetry]
name = "hotel-cancellation-mlops"
version = "0.1.0"
description = "Plateforme MLOps de prédiction des annulations de réservations hôtelières"
authors = ["Rayen Gragba", "Chedi Trabelsi"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
pandas = ">=2.2"
dvc = ">=3.50"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
black = ">=24.0"
flake8 = ">=7.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
